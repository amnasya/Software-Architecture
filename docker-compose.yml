services:
  mysql:
    image: mysql:8.4
    container_name: wspeedrun_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wspeedrun_auth
    ports:
      - '3307:3306'
    volumes:
      - wspeedrun_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wspeedrun_mysql_data:
